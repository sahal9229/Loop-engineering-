{% extends "accounts/base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
  <h1>Welcome Back</h1>
  <p class="subtext">Sign in to continue to your dashboard</p>

  {% if error %}
    <div class="error-banner">{{ error }}</div>
  {% endif %}

  <form method="post" action="{% url 'login' %}" novalidate>
    {% csrf_token %}
    <div class="field">
      <label for="id_email">Email</label>
      <input type="email" id="id_email" name="email" placeholder="you@example.com" required autofocus>
    </div>
    <div class="field">
      <label for="id_password">Password</label>
      <input type="password" id="id_password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
{% endblock %}
