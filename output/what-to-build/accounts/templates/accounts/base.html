<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Loginapp{% endblock %}</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2e1065 0%, #4c1d95 35%, #7e22ce 65%, #c026d3 100%);
    padding: 24px;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }

  .blob-1 {
    width: 380px;
    height: 380px;
    top: -120px;
    left: -100px;
    background: radial-gradient(circle at 30% 30%, #a78bfa, transparent 70%);
  }

  .blob-2 {
    width: 420px;
    height: 420px;
    bottom: -140px;
    right: -120px;
    background: radial-gradient(circle at 60% 60%, #f0abfc, transparent 70%);
  }

  .blob-3 {
    width: 300px;
    height: 300px;
    top: 40%;
    right: 10%;
    background: radial-gradient(circle at 50% 50%, #818cf8, transparent 70%);
  }

  .blob-4 {
    width: 260px;
    height: 260px;
    bottom: 10%;
    left: 8%;
    background: radial-gradient(circle at 50% 50%, #f9a8d4, transparent 70%);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    padding: 36px 32px;
    color: #f5f3ff;
  }

  .card h1 {
    margin: 0 0 8px 0;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
  }

  .card p.subtext {
    margin: 0 0 24px 0;
    text-align: center;
    font-size: 14px;
    color: rgba(245, 243, 255, 0.75);
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: rgba(245, 243, 255, 0.85);
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .field input::placeholder {
    color: rgba(245, 243, 255, 0.45);
  }

  .field input:focus {
    border-color: rgba(216, 180, 254, 0.9);
    box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.35);
    background: rgba(255, 255, 255, 0.14);
  }

  .btn {
    width: 100%;
    padding: 13px 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #a855f7);
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.45);
  }

  .btn:hover {
    filter: brightness(1.08);
    box-shadow: 0 10px 28px rgba(139, 92, 246, 0.6);
  }

  .btn:active {
    transform: translateY(1px);
  }

  .error-banner {
    background: rgba(244, 63, 94, 0.18);
    border: 1px solid rgba(244, 63, 94, 0.45);
    color: #ffe4e6;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 18px;
    text-align: center;
  }

  .welcome {
    text-align: center;
  }

  .welcome .email {
    font-weight: 700;
    word-break: break-word;
  }

  .logout-link {
    display: inline-block;
    margin-top: 24px;
    color: #f5f3ff;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 10px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 14px;
    transition: background 0.2s ease;
  }

  .logout-link:hover {
    background: rgba(255, 255, 255, 0.22);
  }

  @media (max-width: 400px) {
    .card {
      padding: 28px 22px;
    }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>

  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
