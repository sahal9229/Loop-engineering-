<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg-deep: #0d1117;
    --bg-panel: #161b22;
    --border-glow: rgba(88, 166, 255, 0.25);
    --text-main: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1b2230 0%, var(--bg-deep) 60%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    padding: 16px;
    overflow: hidden;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 560px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 4px;
  }

  .title {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #58a6ff, #7ee787, #f2cc60);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .scores {
    display: flex;
    gap: 14px;
  }

  .score-pill {
    background: var(--bg-panel);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 6px 14px;
    font-size: 0.85rem;
    color: var(--text-dim);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }

  .score-pill span {
    color: var(--text-main);
    font-weight: 700;
    margin-left: 6px;
  }

  .board-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 520px;
    border-radius: 20px;
    background: linear-gradient(160deg, #12161d, #0a0e14);
    box-shadow:
      0 12px 30px rgba(0, 0, 0, 0.55),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05),
      0 0 40px var(--border-glow);
    padding: 10px;
  }

  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    background: #0b0f16;
  }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 14px;
    background: rgba(8, 10, 15, 0.85);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    transition: opacity 0.2s ease;
  }

  .overlay.hidden {
    display: none;
  }

  .overlay h2 {
    margin: 0;
    font-size: 1.6rem;
    color: var(--text-main);
  }

  .overlay p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .final-score {
    font-size: 2.2rem;
    font-weight: 800;
    color: #f2cc60;
    text-shadow: 0 0 18px rgba(242, 204, 96, 0.5);
  }

  button {
    cursor: pointer;
    border: none;
    outline: none;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, #58a6ff, #3b82f6);
    color: #04101f;
    font-weight: 700;
    font-size: 1rem;
    padding: 12px 32px;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(88, 166, 255, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(88, 166, 255, 0.45);
  }

  .btn-primary:active {
    transform: translateY(0px) scale(0.97);
  }

  .hint {
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
  }

  .hint kbd {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 0.78rem;
  }

  @media (max-width: 420px) {
    .title { font-size: 1.15rem; }
    .score-pill { font-size: 0.75rem; padding: 5px 10px; }
    .overlay h2 { font-size: 1.3rem; }
    .final-score { font-size: 1.8rem; }
  }
</style>
</head>
<body>

  <div class="game-wrapper">
    <div class="hud">
      <div class="title">Snake</div>
      <div class="scores">
        <div class="score-pill">Score<span id="scoreDisplay">0</span></div>
        <div class="score-pill">Best<span id="highScoreDisplay">0</span></div>
      </div>
    </div>

    <div class="board-stage">
      <canvas id="gameCanvas"></canvas>

      <!-- Shown before the very first game starts -->
      <div id="startScreen" class="overlay">
        <h2>Ready to play?</h2>
        <p>Use the arrow keys to move.<br>Eat the glowing food to grow and score points.</p>
        <button id="startButton" class="btn-primary">Start Game</button>
        <div class="hint">Press <kbd>Space</kbd> anytime to pause / resume</div>
      </div>

      <!-- Shown when the player pauses mid-game -->
      <div id="pauseScreen" class="overlay hidden">
        <h2>Paused</h2>
        <p>Press <kbd>Space</kbd> to resume</p>
      </div>

      <!-- Shown after a collision ends the game -->
      <div id="gameOverScreen" class="overlay hidden">
        <h2>Game Over</h2>
        <div class="final-score" id="finalScoreDisplay">0</div>
        <p id="newHighScoreNote" class="hidden">New high score!</p>
        <button id="playAgainButton" class="btn-primary">Play Again</button>
      </div>
    </div>

    <div class="hint">Arrow keys to move &nbsp;•&nbsp; Space to pause/resume &nbsp;•&nbsp; Swipe on mobile</div>
  </div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Configuration
  // ---------------------------------------------------------------------
  const GRID_COLUMNS = 20;          // number of cells across the board
  const GRID_ROWS = 20;             // number of cells down the board
  const MOVE_INTERVAL_MS = 110;     // time between snake steps (consistent speed)
  const INITIAL_SNAKE_LENGTH = 4;

  // Colour palette for a lively, modern dark-theme look.
  const COLOR_SNAKE_HEAD = '#7ee787';
  const COLOR_SNAKE_BODY_A = '#58a6ff';
  const COLOR_SNAKE_BODY_B = '#3fb1ce';
  const COLOR_FOOD = '#f2cc60';
  const COLOR_FOOD_GLOW = 'rgba(242, 204, 96, 0.55)';
  const COLOR_GRID_LINE = 'rgba(255, 255, 255, 0.03)';

  // ---------------------------------------------------------------------
  // DOM references
  // ---------------------------------------------------------------------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const highScoreDisplay = document.getElementById('highScoreDisplay');
  const finalScoreDisplay = document.getElementById('finalScoreDisplay');
  const newHighScoreNote = document.getElementById('newHighScoreNote');
  const startScreen = document.getElementById('startScreen');
  const pauseScreen = document.getElementById('pauseScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const startButton = document.getElementById('startButton');
  const playAgainButton = document.getElementById('playAgainButton');

  // ---------------------------------------------------------------------
  // Mutable game state (all in-memory only, nothing persisted to disk)
  // ---------------------------------------------------------------------
  let snake = [];                 // array of {x, y} grid coordinates, index 0 = head
  let previousSnake = [];         // positions before the last step, used to interpolate smooth motion
  let direction = { x: 1, y: 0 }; // current locked-in movement direction
  let queuedDirection = null;     // next direction requested by the player, applied on next step
  let directionLockedThisTick = false; // prevents two 180-degree turns within a single step
  let food = { x: 0, y: 0 };
  let score = 0;
  let highScore = 0;              // session-only "high score"; intentionally not persisted
  let highScoreBeforeThisRun = 0; // snapshot taken at the start of each game, used to tell a genuine new record apart from merely tying the existing one
  let cellPixelSize = 0;
  let lastStepTimestamp = 0;
  let animationFrameId = null;
  let gameState = 'idle';         // 'idle' | 'running' | 'paused' | 'gameover'
  let audioContext = null;        // created lazily on first user interaction

  // ---------------------------------------------------------------------
  // Canvas sizing (keeps the board crisp and responsive on any screen)
  // ---------------------------------------------------------------------
  function resizeCanvasToDisplaySize() {
    const displayWidth = canvas.clientWidth;
    const displayHeight = canvas.clientHeight;
    const devicePixelRatio = window.devicePixelRatio || 1;

    canvas.width = Math.round(displayWidth * devicePixelRatio);
    canvas.height = Math.round(displayHeight * devicePixelRatio);
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    cellPixelSize = displayWidth / GRID_COLUMNS;
    drawFrame(1); // redraw immediately so a resize never shows a blank board
  }

  // ---------------------------------------------------------------------
  // Sound effects, built entirely from the Web Audio API (no audio files)
  // ---------------------------------------------------------------------
  function getAudioContext() {
    if (!audioContext) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContextClass();
    }
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
    return audioContext;
  }

  function playTone(frequency, durationSeconds, type, startTimeOffset, volume) {
    const ctxAudio = getAudioContext();
    const oscillator = ctxAudio.createOscillator();
    const gainNode = ctxAudio.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    const startTime = ctxAudio.currentTime + (startTimeOffset || 0);
    gainNode.gain.setValueAtTime(volume, startTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + durationSeconds);

    oscillator.connect(gainNode);
    gainNode.connect(ctxAudio.destination);

    oscillator.start(startTime);
    oscillator.stop(startTime + durationSeconds);
  }

  function playEatSound() {
    playTone(660, 0.09, 'square', 0, 0.15);
    playTone(880, 0.08, 'square', 0.06, 0.12);
  }

  function playGameOverSound() {
    playTone(300, 0.18, 'sawtooth', 0, 0.15);
    playTone(220, 0.22, 'sawtooth', 0.15, 0.15);
    playTone(140, 0.3, 'sawtooth', 0.3, 0.15);
  }

  // ---------------------------------------------------------------------
  // Game setup
  // ---------------------------------------------------------------------
  function createInitialSnake() {
    const startX = Math.floor(GRID_COLUMNS / 2);
    const startY = Math.floor(GRID_ROWS / 2);
    const segments = [];
    for (let i = 0; i < INITIAL_SNAKE_LENGTH; i++) {
      segments.push({ x: startX - i, y: startY });
    }
    return segments;
  }

  function placeFoodOnEmptyCell() {
    const occupied = new Set(snake.map(segment => `${segment.x},${segment.y}`));
    const emptyCells = [];

    for (let x = 0; x < GRID_COLUMNS; x++) {
      for (let y = 0; y < GRID_ROWS; y++) {
        if (!occupied.has(`${x},${y}`)) {
          emptyCells.push({ x, y });
        }
      }
    }

    // Board full (snake fills every cell) - nothing to place, treat as a win state.
    if (emptyCells.length === 0) {
      return null;
    }

    const randomIndex = Math.floor(Math.random() * emptyCells.length);
    return emptyCells[randomIndex];
  }

  function resetGameState() {
    snake = createInitialSnake();
    previousSnake = snake.map(segment => ({ ...segment }));
    direction = { x: 1, y: 0 };
    queuedDirection = null;
    score = 0;
    highScoreBeforeThisRun = highScore;
    food = placeFoodOnEmptyCell();
    updateScoreDisplay();
  }

  // ---------------------------------------------------------------------
  // Input handling
  // ---------------------------------------------------------------------
  const DIRECTIONS = {
    ArrowUp: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }
  };

  function isOppositeDirection(a, b) {
    return a.x === -b.x && a.y === -b.y;
  }

  function requestDirectionChange(newDirection) {
    if (directionLockedThisTick) return;
    // Compare against the currently queued direction (if any) rather than the
    // stale `direction`, so two rapid key presses in one tick can't sneak
    // the snake into reversing on itself.
    const referenceDirection = queuedDirection || direction;
    if (isOppositeDirection(newDirection, referenceDirection)) return;
    queuedDirection = newDirection;
    directionLockedThisTick = true;
  }

  function handleKeyDown(event) {
    if (event.code === 'Space') {
      event.preventDefault();
      togglePause();
      return;
    }
    const requestedDirection = DIRECTIONS[event.key];
    if (requestedDirection && gameState === 'running') {
      event.preventDefault();
      requestDirectionChange(requestedDirection);
    }
  }

  // Basic swipe support so the game is playable on touch devices too.
  let touchStartX = 0;
  let touchStartY = 0;

  function handleTouchStart(event) {
    const touch = event.changedTouches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }

  function handleTouchEnd(event) {
    if (gameState !== 'running') return;
    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - touchStartX;
    const deltaY = touch.clientY - touchStartY;
    const SWIPE_THRESHOLD = 24;

    if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < SWIPE_THRESHOLD) return;

    if (Math.abs(deltaX) > Math.abs(deltaY)) {
      requestDirectionChange(deltaX > 0 ? DIRECTIONS.ArrowRight : DIRECTIONS.ArrowLeft);
    } else {
      requestDirectionChange(deltaY > 0 ? DIRECTIONS.ArrowDown : DIRECTIONS.ArrowUp);
    }
  }

  // ---------------------------------------------------------------------
  // Core game loop (fixed-timestep logic, driven by requestAnimationFrame)
  // ---------------------------------------------------------------------
  function stepGame() {
    if (queuedDirection) {
      direction = queuedDirection;
      queuedDirection = null;
    }
    directionLockedThisTick = false;

    previousSnake = snake.map(segment => ({ ...segment }));

    const currentHead = snake[0];
    const newHead = { x: currentHead.x + direction.x, y: currentHead.y + direction.y };

    if (isWallCollision(newHead)) {
      endGame();
      return;
    }

    const ateFood = food && newHead.x === food.x && newHead.y === food.y;

    // The tail cell vacates this same tick unless the snake is growing, so it
    // must be excluded from the self-collision check - otherwise moving into
    // the current tail position (e.g. the snake curling into a tight loop)
    // would be wrongly flagged as a crash.
    const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
    if (isSelfCollision(newHead, bodyToCheck)) {
      endGame();
      return;
    }

    snake.unshift(newHead);

    if (ateFood) {
      score += 1;
      updateScoreDisplay();
      playEatSound();
      food = placeFoodOnEmptyCell();
      // Snake grows: keep the tail (don't pop it) this tick.
    } else {
      snake.pop();
    }
  }

  function isWallCollision(position) {
    return position.x < 0 || position.x >= GRID_COLUMNS || position.y < 0 || position.y >= GRID_ROWS;
  }

  function isSelfCollision(newHead, body) {
    return body.some(segment => segment.x === newHead.x && segment.y === newHead.y);
  }

  function updateScoreDisplay() {
    scoreDisplay.textContent = String(score);
    if (score > highScore) {
      highScore = score;
      highScoreDisplay.textContent = String(highScore);
    }
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function lerp(start, end, t) {
    return start + (end - start) * t;
  }

  function drawRoundedCell(gridX, gridY, fillStyle, inset) {
    const pixelInset = inset || 1.5;
    const x = gridX * cellPixelSize + pixelInset;
    const y = gridY * cellPixelSize + pixelInset;
    const size = cellPixelSize - pixelInset * 2;
    const radius = size * 0.3;

    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + size, y, x + size, y + size, radius);
    ctx.arcTo(x + size, y + size, x, y + size, radius);
    ctx.arcTo(x, y + size, x, y, radius);
    ctx.arcTo(x, y, x + size, y, radius);
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }

  function drawGridLines(displayWidth, displayHeight) {
    ctx.strokeStyle = COLOR_GRID_LINE;
    ctx.lineWidth = 1;
    for (let x = 1; x < GRID_COLUMNS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * cellPixelSize, 0);
      ctx.lineTo(x * cellPixelSize, displayHeight);
      ctx.stroke();
    }
    for (let y = 1; y < GRID_ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * cellPixelSize);
      ctx.lineTo(displayWidth, y * cellPixelSize);
      ctx.stroke();
    }
  }

  function drawFood(timestampMs) {
    if (!food) return;
    const pulse = 1 + 0.08 * Math.sin(timestampMs / 180);
    const centerX = (food.x + 0.5) * cellPixelSize;
    const centerY = (food.y + 0.5) * cellPixelSize;
    const radius = (cellPixelSize * 0.38) * pulse;

    ctx.save();
    ctx.shadowColor = COLOR_FOOD_GLOW;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fillStyle = COLOR_FOOD;
    ctx.fill();
    ctx.restore();
  }

  // Renders the snake interpolated between its previous and current grid
  // positions so movement reads as smooth gliding rather than a discrete
  // per-cell jump, even though the underlying logic steps on a fixed grid.
  function drawSnake(t) {
    for (let i = snake.length - 1; i >= 0; i--) {
      const current = snake[i];
      const previous = previousSnake[i] || current;
      const drawX = lerp(previous.x, current.x, t);
      const drawY = lerp(previous.y, current.y, t);
      const isHead = i === 0;
      const color = isHead
        ? COLOR_SNAKE_HEAD
        : (i % 2 === 0 ? COLOR_SNAKE_BODY_A : COLOR_SNAKE_BODY_B);

      drawRoundedCell(drawX, drawY, color, isHead ? 1 : 2);
    }
  }

  function drawFrame(t) {
    const displayWidth = canvas.clientWidth;
    const displayHeight = canvas.clientHeight;

    ctx.clearRect(0, 0, displayWidth, displayHeight);
    drawGridLines(displayWidth, displayHeight);
    drawFood(performance.now());
    drawSnake(t);
  }

  // ---------------------------------------------------------------------
  // Main animation loop: fixed-timestep updates, smooth interpolated render
  // ---------------------------------------------------------------------
  function animationLoop(timestamp) {
    if (gameState !== 'running') {
      return; // loop is restarted explicitly by resumeGame()/startGame()
    }

    if (!lastStepTimestamp) {
      lastStepTimestamp = timestamp;
    }

    const elapsed = timestamp - lastStepTimestamp;

    if (elapsed >= MOVE_INTERVAL_MS) {
      stepGame();
      lastStepTimestamp = timestamp;
    }

    if (gameState === 'running') {
      const t = Math.min(1, (timestamp - lastStepTimestamp) / MOVE_INTERVAL_MS);
      drawFrame(t);
      animationFrameId = requestAnimationFrame(animationLoop);
    }
  }

  function startAnimationLoop() {
    lastStepTimestamp = 0;
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame(animationLoop);
  }

  // ---------------------------------------------------------------------
  // Game state transitions
  // ---------------------------------------------------------------------
  function startGame() {
    getAudioContext(); // unlock audio on this user gesture
    resetGameState();
    gameState = 'running';
    hideAllOverlays();
    startAnimationLoop();
  }

  function togglePause() {
    if (gameState === 'running') {
      gameState = 'paused';
      pauseScreen.classList.remove('hidden');
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    } else if (gameState === 'paused') {
      gameState = 'running';
      pauseScreen.classList.add('hidden');
      startAnimationLoop();
    }
  }

  function endGame() {
    gameState = 'gameover';
    playGameOverSound();
    finalScoreDisplay.textContent = String(score);
    newHighScoreNote.classList.toggle('hidden', score <= highScoreBeforeThisRun);
    gameOverScreen.classList.remove('hidden');
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
  }

  function hideAllOverlays() {
    startScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
  }

  // ---------------------------------------------------------------------
  // Wire up events
  // ---------------------------------------------------------------------
  startButton.addEventListener('click', startGame);
  playAgainButton.addEventListener('click', startGame);
  document.addEventListener('keydown', handleKeyDown);
  canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: true });
  window.addEventListener('resize', resizeCanvasToDisplaySize);

  // Initial paint so the board isn't blank behind the start overlay.
  snake = createInitialSnake();
  previousSnake = snake.map(segment => ({ ...segment }));
  food = placeFoodOnEmptyCell();
  resizeCanvasToDisplaySize();
})();
</script>

</body>
</html>
